<figcaption><strong>How the P0 bench is wired</strong> (proposal). Every stream lands on the CM5 hub, the only clock: USB for the keyboard, the generator and the receiver, Wi-Fi for the bands, and BLE plus a microSD card pull for the earbuds<sup class="cite">[<a href="#ref-5">5</a>, <a href="#ref-19">19</a>]</sup>. The body code (dotted) never touches the hub: the generator drives an ear electrode at a few microamps, and the receiver listens at the wrist and the keycap<sup class="cite">[<a href="#ref-26">26</a>]</sup>. A trigger line from the generator clocks the receiver so demodulation stays synchronous<sup class="cite">[<a href="#ref-14">14</a>]</sup>, and the receiver fires the sync pulses.</figcaption>
</figure>
