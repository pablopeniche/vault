  <rect class="d-hot" x="116" y="106" width="140" height="42" rx="5"/>

<figcaption><strong>Agreement binds; the anchor identifies.</strong> When the wrist, the camera, the radar and the keyboard tell one consistent story, they are almost certainly watching one living body. They are not proving whose body it is. A real-time face swap carries the pulse of the attacker driving it, so an attacker's own band agrees with their deepfake perfectly<sup class="cite">[<a href="#ref-16">16</a>, <a href="#ref-17">17</a>]</sup>. Identity enters only through a hard biometric on an attested sensor, which anchors the carrier. Custody then carries that anchor forward, and cross-checks bind everything else to the anchored body.</figcaption>
</figure>
