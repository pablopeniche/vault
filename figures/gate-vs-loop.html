<figcaption><strong>Gate vs. loop: the question kept alive.</strong> A gate that re-checks "is the enrolled face still here?" trusts every keystroke inside the session alike: the owner's, an AI agent's, or an injected device's. The loop asks a question per input instead. Body-bound owner input reaches the vaulted context. Agent input goes to the agent's own workspace under an owner-signed mandate. Unattributed input is blocked and counted as a contradiction<sup class="cite">[<a href="#ref-24">24</a>, <a href="#ref-26">26</a>, <a href="#ref-56">56</a>]</sup>.</figcaption>
