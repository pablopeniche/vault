    <marker id="idf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L10 5L0 10z"/></marker>
    <marker id="idf-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="d-arrow-hot" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="d-box" x="290" y="28" width="160" height="56" rx="5"/>

<figcaption><strong>How identity travels</strong> (proposal). The hub signs credentials only while the checks hold, and the phone presents and never mints, holding presenting rights through <a href="agents.html">the command chain</a>'s narrowing tokens. The Z2 proof (dotted) shows a hub-signed checkpoint sits in the trace log's Merkle tree without revealing which, and wrapped attributes arrive as proofs generated on the phone<sup class="cite">[<a href="#ref-1">1</a>, <a href="#ref-10">10</a>]</sup>.</figcaption>
