<figure class="diagram">
<div class="svg-scroll">
<svg viewBox="0 0 760 276" role="img" aria-label="The loop architecture. On-body, device-side and ambient channels send signed evidence to cross-checks that test for one body and whether the inputs are explained. A trust engine decays trust slowly on missing evidence and cuts it to zero on contradiction. An enforcement point outside the operating system turns trust into short-lived keys, input routing and loop state. When custody breaks, the loop schedules its own re-anchoring check.">

    <marker id="la-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L10 5L0 10z"/></marker>

  <text class="d-label" x="105" y="59" text-anchor="middle">On-body</text>
  <text class="d-sub" x="105" y="75" text-anchor="middle">custody, liveness</text>

<figcaption><strong>The loop</strong> (proposal). Channels on the body, the device and in the room send signed evidence. Cross-checks bind that evidence to one body and ask whether every input is explained by it. The trust engine lets missing evidence decay slowly but cuts trust to zero on any contradiction. An enforcement point outside the operating system turns the result into short-lived keys, per-input routing and loop state. A strong identity check is not a door at the start. It is a step the loop schedules for itself whenever custody breaks<sup class="cite">[<a href="#ref-15">15</a>, <a href="#ref-34">34</a>]</sup>.</figcaption>
</figure>
