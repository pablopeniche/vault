<figcaption><strong>How the pieces check each other.</strong> Every device appears in at least two checks, so faking or stealing one piece breaks another. <em>Same heartbeat</em>: each beat from the chest patch must reach the ear, face and finger on that owner's schedule<sup class="cite">[<a href="#ref-15">15</a>, <a href="#ref-16">16</a>]</sup>. <em>Same hands</em>: each signed key-down must pair with exactly one wrist-muscle burst, and each burst with one key<sup class="cite">[<a href="#ref-13">13</a>, <a href="#ref-14">14</a>]</sup>. <em>Same person</em>: at least one hard identity signal is always fresh. <em>Custody</em>: nothing has come off since the owner last proved who they are. The hub keeps the computer's keys alive for a few seconds at a time, only while all four hold.</figcaption>
</figure>
