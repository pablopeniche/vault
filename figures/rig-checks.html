<figure class="diagram">
<div class="svg-scroll">
<svg viewBox="0 0 760 450" role="img" aria-label="Five checks feed the Vault hub. Same voice: the earbud's air microphone and skull sensor must agree within 5 milliseconds, and only matching audio is transcribed. Same hands: each signed key-down must match a fingertip on that key in the hands tracker and carry the earbuds' body code. Same person: ear canal, infrared face and fingerprint key. Custody: earbuds in, body code unbroken, one person and two hands in view. Same chain: a hub-signed command goes to the master agent, which plans, and a gateway checks every call. The hub keeps keys alive for seconds only while all five hold.">
  <defs>
    <marker id="rk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L10 5L0 10z"/></marker>
    <marker id="rk-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="d-arrow-hot" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <text class="d-zone-label" x="16" y="47">Same voice</text>
  <text class="d-sub" x="16" y="63">every 20–40 ms</text>
  <rect class="d-box" x="140" y="26" width="126" height="46" rx="5"/>
  <text class="d-label" x="203" y="46" text-anchor="middle">Earbud mic</text>
  <text class="d-sub" x="203" y="62" text-anchor="middle">air</text>
  <rect class="d-box" x="296" y="26" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="46" text-anchor="middle">Skull sensor</text>
  <text class="d-sub" x="359" y="62" text-anchor="middle">bone</text>
  <rect class="d-box" x="452" y="26" width="126" height="46" rx="5"/>
  <text class="d-label" x="515" y="46" text-anchor="middle">Transcript</text>
  <text class="d-sub" x="515" y="62" text-anchor="middle">matching audio only</text>
  <line class="d-line-hot" x1="268" y1="49" x2="294" y2="49" marker-start="url(#rk-arrow-hot)" marker-end="url(#rk-arrow-hot)"/>
  <text class="d-edge-hot" x="281" y="20" text-anchor="middle">±5 ms</text>
  <line class="d-line" x1="422" y1="49" x2="450" y2="49" marker-end="url(#rk-arrow)"/>
  <line class="d-line" x1="578" y1="49" x2="634" y2="49" marker-end="url(#rk-arrow)"/>
  <line class="d-rule" x1="16" y1="94" x2="620" y2="94"/>
  <text class="d-zone-label" x="16" y="137">Same hands</text>
  <text class="d-sub" x="16" y="153">every keystroke</text>
  <rect class="d-box" x="140" y="116" width="126" height="46" rx="5"/>
  <text class="d-label" x="203" y="136" text-anchor="middle">Keyboard</text>
  <text class="d-sub" x="203" y="152" text-anchor="middle">signed key-down</text>
  <rect class="d-box" x="296" y="116" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="136" text-anchor="middle">Hands tracker</text>
  <text class="d-sub" x="359" y="152" text-anchor="middle">finger on that key</text>
  <rect class="d-box" x="452" y="116" width="126" height="46" rx="5"/>
  <text class="d-label" x="515" y="136" text-anchor="middle">Body code</text>
  <text class="d-sub" x="515" y="152" text-anchor="middle">from the earbuds</text>
  <line class="d-line-hot" x1="268" y1="139" x2="294" y2="139" marker-start="url(#rk-arrow-hot)" marker-end="url(#rk-arrow-hot)"/>
  <text class="d-edge-hot" x="281" y="110" text-anchor="middle">same key</text>
  <line class="d-line-hot" x1="424" y1="139" x2="450" y2="139" marker-start="url(#rk-arrow-hot)" marker-end="url(#rk-arrow-hot)"/>
  <text class="d-edge-hot" x="437" y="110" text-anchor="middle">same touch</text>
  <line class="d-line" x1="578" y1="139" x2="634" y2="139" marker-end="url(#rk-arrow)"/>
  <line class="d-rule" x1="16" y1="184" x2="620" y2="184"/>
  <text class="d-zone-label" x="16" y="227">Same person</text>
  <text class="d-sub" x="16" y="243">every few seconds</text>
  <rect class="d-box" x="140" y="206" width="126" height="46" rx="5"/>
  <text class="d-label" x="203" y="226" text-anchor="middle">Earbuds</text>
  <text class="d-sub" x="203" y="242" text-anchor="middle">ear canal</text>
  <rect class="d-box" x="296" y="206" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="226" text-anchor="middle">Face camera</text>
  <text class="d-sub" x="359" y="242" text-anchor="middle">IR face</text>
  <rect class="d-box" x="452" y="206" width="126" height="46" rx="5"/>
  <text class="d-label" x="515" y="226" text-anchor="middle">Keyboard</text>
  <text class="d-sub" x="515" y="242" text-anchor="middle">fingerprint key</text>
  <line class="d-line" x1="578" y1="229" x2="634" y2="229" marker-end="url(#rk-arrow)"/>
  <line class="d-rule" x1="16" y1="274" x2="620" y2="274"/>
  <text class="d-zone-label" x="16" y="317">Custody</text>
  <text class="d-sub" x="16" y="333">continuous</text>
  <rect class="d-box" x="140" y="296" width="126" height="46" rx="5"/>
  <text class="d-label" x="203" y="316" text-anchor="middle">Earbuds</text>
  <text class="d-sub" x="203" y="332" text-anchor="middle">in-ear sensor</text>
  <rect class="d-box" x="296" y="296" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="316" text-anchor="middle">Body code</text>
  <text class="d-sub" x="359" y="332" text-anchor="middle">unbroken</text>
  <rect class="d-box" x="452" y="296" width="126" height="46" rx="5"/>
  <text class="d-label" x="515" y="316" text-anchor="middle">Cameras</text>
  <text class="d-sub" x="515" y="332" text-anchor="middle">one person, 2 hands</text>
  <line class="d-line" x1="578" y1="319" x2="634" y2="319" marker-end="url(#rk-arrow)"/>
  <line class="d-rule" x1="16" y1="364" x2="620" y2="364"/>
  <text class="d-zone-label" x="16" y="407">Same chain</text>
  <text class="d-sub" x="16" y="423">every agent action</text>
  <rect class="d-box" x="140" y="386" width="126" height="46" rx="5"/>
  <text class="d-label" x="203" y="406" text-anchor="middle">Hub</text>
  <text class="d-sub" x="203" y="422" text-anchor="middle">signed command</text>
  <rect class="d-box" x="296" y="386" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="406" text-anchor="middle">Master agent</text>
  <text class="d-sub" x="359" y="422" text-anchor="middle">plans</text>
  <rect class="d-box" x="452" y="386" width="126" height="46" rx="5"/>
  <text class="d-label" x="515" y="406" text-anchor="middle">Gateway</text>
  <text class="d-sub" x="515" y="422" text-anchor="middle">checks each call</text>
  <line class="d-line" x1="266" y1="409" x2="294" y2="409" marker-end="url(#rk-arrow)"/>
  <line class="d-line" x1="422" y1="409" x2="450" y2="409" marker-end="url(#rk-arrow)"/>
  <line class="d-line" x1="578" y1="409" x2="634" y2="409" marker-end="url(#rk-arrow)"/>
  <rect class="d-hot" x="636" y="26" width="108" height="406" rx="6"/>
  <text class="d-label" x="690" y="199" text-anchor="middle">Vault hub</text>
  <text class="d-sub" x="690" y="221" text-anchor="middle">all five</text>
  <text class="d-sub" x="690" y="236" text-anchor="middle">must hold</text>
  <text class="d-edge-hot" x="690" y="263" text-anchor="middle">keys live</text>
  <text class="d-edge-hot" x="690" y="278" text-anchor="middle">for seconds</text>
</svg>
</div>
<figcaption><strong>How the pieces check each other.</strong> No piece is trusted on its own. Speech counts only when the skull sensor felt it<sup class="cite">[<a href="#ref-15">15</a>]</sup>; a keystroke counts only when a fingertip was seen on that key and the body code came through it<sup class="cite">[<a href="#ref-22">22</a>, <a href="#ref-23">23</a>]</sup>; an agent action counts only when it traces to a signed command<sup class="cite">[<a href="#ref-9">9</a>, <a href="#ref-10">10</a>]</sup>. The hub keeps the computer's keys alive for a few seconds at a time, only while all five checks hold.</figcaption>
</figure>
