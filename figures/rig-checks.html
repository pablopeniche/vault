<svg viewBox="0 0 760 450" role="img" aria-label="Five checks feed the Vault hub. Same voice: the earbud's air microphone and skull sensor must agree within 5 milliseconds, and only matching audio is transcribed. Same hands: each wristband muscle burst and signed key-down must pair one to one, 80 to 200 milliseconds apart, and the pressed keycap must hear the earbuds' body code. Same person: ear canal, infrared face and fingerprint key. Custody: the earbuds' body code reaches the wristbands, proving one body, and the face camera sees one person. Same chain: a hub-signed command goes to the master agent and a gateway checks every call. The hub keeps keys alive for seconds only while all five hold.">

  </defs>

  <rect class="d-box" x="296" y="116" width="126" height="46" rx="5"/>
  <text class="d-label" x="359" y="136" text-anchor="middle">Keyboard</text>
  <text class="d-sub" x="359" y="152" text-anchor="middle">signed key-down</text>

  <text class="d-sub" x="690" y="236" text-anchor="middle">must hold</text>
  <text class="d-edge-hot" x="690" y="263" text-anchor="middle">keys live</text>
  <text class="d-edge-hot" x="690" y="278" text-anchor="middle">for seconds</text>
</svg>
</div>
<figcaption><strong>How the pieces check each other.</strong> No piece is trusted on its own. Speech counts only when the skull sensor felt it<sup class="cite">[<a href="#ref-17">17</a>]</sup>. A keystroke counts only when a wrist-muscle burst came first and its keycap heard the body code<sup class="cite">[<a href="#ref-23">23</a>, <a href="#ref-29">29</a>]</sup>. Earbuds and wristbands prove they are on one body by passing a code through the skin<sup class="cite">[<a href="#ref-29">29</a>]</sup>. An agent action counts only when it traces to a signed command<sup class="cite">[<a href="#ref-12">12</a>, <a href="#ref-13">13</a>]</sup>. The hub keeps the computer's keys alive for a few seconds at a time, only while all five checks hold.</figcaption>
</figure>
