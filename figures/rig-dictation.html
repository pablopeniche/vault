<figure class="diagram">

<svg viewBox="0 0 690 220" role="img" aria-label="Dictation check. The owner says send the Q3 report to Ana; each voiced piece appears both in the earbud microphone and as skull vibration, aligned within 5 milliseconds, and becomes text. A loudspeaker or AI voice inserts and wire five thousand dollars; the microphone hears it but the skull sensor feels nothing, so it is dropped before transcription.">
  <text class="d-zone-label" x="16" y="49">earbud mic</text>
  <text class="d-sub" x="16" y="65">air</text>
  <text class="d-zone-label" x="16" y="109">skull sensor</text>
  <text class="d-sub" x="16" y="125">bone</text>
  <text class="d-zone-label" x="16" y="173">transcript</text>
  <text class="d-sub" x="16" y="189">what becomes text</text>
  <rect class="d-hot" x="160" y="40" width="76" height="22" rx="4"/>
  <rect class="d-hot" x="160" y="100" width="76" height="22" rx="4"/>
  <line class="d-guide" x1="160" y1="62" x2="160" y2="100"/>
  <text class="d-label" x="198" y="182" text-anchor="middle">send the</text>
  <rect class="d-hot" x="250" y="40" width="86" height="22" rx="4"/>
  <rect class="d-hot" x="250" y="100" width="86" height="22" rx="4"/>
  <line class="d-guide" x1="250" y1="62" x2="250" y2="100"/>

  <text class="d-sub" x="421" y="115" text-anchor="middle">no skull vibration</text>

<figcaption><strong>Speech counts only if your skull felt it.</strong> The earbud's microphone hears everything in the room. The skull sensor in the same earbud feels only the wearer's own voice. Each voiced piece must appear in both, on the earbud's own clock, within a few milliseconds, or it never reaches transcription<sup class="cite">[<a href="#ref-15">15</a>, <a href="#ref-17">17</a>]</sup>. The skull signal shows <em>when</em> you spoke precisely, and <em>what</em> you said only roughly<sup class="cite">[<a href="#ref-19">19</a>]</sup>.</figcaption>
</figure>
