<figcaption><strong>One keystroke, in milliseconds.</strong> The wrist muscles start firing about 150 ms before the key bottoms out, and the finger starts moving about 83 ms before<sup class="cite">[<a href="#ref-23">23</a>]</sup>. Each signed key-down must pair with exactly one burst inside the window, and each burst with one key. An injected keystroke has no burst behind it.</figcaption>
