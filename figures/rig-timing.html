<figcaption><strong>One heartbeat and one keystroke, in milliseconds.</strong> Top: seated-adult values measured from the heartbeat. The face value is an estimate, because no study gives it directly. A check would compare the <em>gaps</em> between sites, calibrated per owner, over 10–30 beats<sup class="cite">[<a href="#ref-40">40</a>, <a href="#ref-41">41</a>]</sup>. A live deepfake's face pulse comes from the attacker's own heart and lands late, because rendering adds at least ~43 ms per frame<sup class="cite">[<a href="#ref-35">35</a>, <a href="#ref-43">43</a>]</sup>. Bottom: wrist-muscle activity starts about 150 ms before the key bottoms out, and the finger starts moving about 83 ms before. Every signed key-down must pair with one burst inside the window<sup class="cite">[<a href="#ref-30">30</a>]</sup>.</figcaption>
