<figure class="diagram">
<div class="svg-scroll">
<svg viewBox="0 0 720 280" role="img" aria-label="Timeline comparison. A typical session authenticates once and stays valid for hours, even after someone else sits down. A Vault session key stays alive only while signed presence attestations keep arriving, and is dropped seconds after they stop.">
  <text class="d-zone-label" x="20" y="72">Typical session</text>
  <text class="d-sub" x="20" y="88">authenticate once</text>
  <line class="d-line" x1="180" y1="50" x2="180" y2="106"/>
  <text class="d-edge" x="180" y="42">MFA at login</text>
  <rect class="d-box-soft" x="180" y="80" width="500" height="18" rx="3"/>
  <text class="d-sub" x="610" y="93" text-anchor="middle">token valid for hours</text>
  <line class="d-line-dash" x1="360" y1="50" x2="360" y2="106"/>
  <text class="d-edge" x="360" y="42" text-anchor="middle">someone else sits down</text>
  <text class="d-sub" x="360" y="122" text-anchor="middle">session still valid</text>
  <line class="d-line-dash" x1="510" y1="50" x2="510" y2="106"/>
  <text class="d-edge" x="510" y="42" text-anchor="middle">revocation event</text>
  <text class="d-sub" x="510" y="122" text-anchor="middle">up to 15 min to propagate</text>

  <line class="d-rule" x1="20" y1="148" x2="700" y2="148"/>

  <text class="d-zone-label" x="20" y="212">Vault session</text>
  <text class="d-sub" x="20" y="228">presence-gated</text>
  <text class="d-edge-hot" x="180" y="180">signed attestation every few seconds</text>
    <line class="d-line-hot" x1="180" y1="190" x2="180" y2="206"/>
    <line class="d-line-hot" x1="200" y1="190" x2="200" y2="206"/>
    <line class="d-line-hot" x1="220" y1="190" x2="220" y2="206"/>
    <line class="d-line-hot" x1="240" y1="190" x2="240" y2="206"/>
    <line class="d-line-hot" x1="260" y1="190" x2="260" y2="206"/>
    <line class="d-line-hot" x1="280" y1="190" x2="280" y2="206"/>
    <line class="d-line-hot" x1="300" y1="190" x2="300" y2="206"/>
    <line class="d-line-hot" x1="320" y1="190" x2="320" y2="206"/>
    <line class="d-line-hot" x1="340" y1="190" x2="340" y2="206"/>
    <line class="d-line-hot" x1="360" y1="190" x2="360" y2="206"/>
    <line class="d-line-hot" x1="380" y1="190" x2="380" y2="206"/>
    <line class="d-line-hot" x1="400" y1="190" x2="400" y2="206"/>
    <line class="d-line-hot" x1="420" y1="190" x2="420" y2="206"/>
    <line class="d-line-hot" x1="440" y1="190" x2="440" y2="206"/>
    <line class="d-line-hot" x1="460" y1="190" x2="460" y2="206"/>
  <rect class="d-hot" x="180" y="212" width="300" height="18" rx="3"/>
  <text class="d-edge" x="330" y="225" text-anchor="middle">session key alive</text>
  <line class="d-line-dash" x1="470" y1="172" x2="470" y2="250"/>
  <text class="d-edge" x="478" y="180">presence lost</text>
  <path class="d-line-hot" d="M484 215L496 227M496 215L484 227"/>
  <text class="d-edge-hot" x="508" y="225">key dropped, session ends</text>
  <text class="d-sub" x="478" y="262">absence, impostor or killed agent</text>
</svg>
</div>
<figcaption><strong>Authenticate once vs. stay authenticated.</strong> Most access systems check identity at login and then trust the session for hours. Microsoft Entra's continuous access evaluation, for example, takes up to 15 minutes to propagate a revocation<sup class="cite">[<a href="#ref-50">50</a>]</sup>. In the proposed Vault design, the session key lives only while fresh, hardware-signed presence attestations keep arriving. Absence, an impostor or a killed agent all fail closed within seconds.</figcaption>
</figure>
