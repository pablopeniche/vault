<figcaption><strong>Proposed trust model</strong> (a proposal, not a benchmark). An explicit check (fingerprint, palm vein or iris plus a hardware key) sets trust to 1. Trust decays over minutes, and each passive 3D-face match nudges it back up. Absence lets it fall and locks the screen. A privileged action below the threshold forces a fresh step-up check. A different face ends the session at once, without waiting for decay<sup class="cite">[<a href="#ref-17">17</a>, <a href="#ref-90">90</a>]</sup>.</figcaption>
