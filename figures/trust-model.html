<figure class="diagram">
<div class="svg-scroll">
<svg viewBox="0 0 720 260" role="img" aria-label="Proposed trust score over time. An anchor check sets trust to 1. Trust decays slowly while passive face refreshes nudge it up, falls while evidence is missing when the owner steps away, recovers on a face refresh at return, is reset by a re-anchor before a vault action, and drops to zero at once on a contradiction such as a new face.">
  <line class="d-line" x1="60" y1="40" x2="60" y2="214"/>
  <line class="d-line" x1="60" y1="214" x2="700" y2="214"/>
  <text class="d-sub" x="52" y="44" text-anchor="end">T = 1</text>
  <text class="d-sub" x="52" y="214" text-anchor="end">0</text>
  <text class="d-sub" x="52" y="130" text-anchor="end">trust</text>
  <line class="d-line-hot" x1="60" y1="91" x2="700" y2="91" stroke-dasharray="6 4"/>
  <text class="d-edge-hot" x="70" y="108">vault-action threshold</text>
  <line class="d-guide" x1="300" y1="40" x2="300" y2="214"/>
  <line class="d-guide" x1="390" y1="40" x2="390" y2="214"/>
  <line class="d-guide" x1="490" y1="40" x2="490" y2="214"/>
  <line class="d-guide" x1="590" y1="40" x2="590" y2="214"/>
  <rect x="300" y="40" width="90" height="174" fill="currentColor" opacity="0.05"/>
  <polyline class="d-line" stroke-width="2" stroke-linejoin="round" points="60,40 90,49 90,43 120,52 120,46 150,55 150,49 180,58 180,52 210,61 210,55 240,64 240,58 270,67 270,61 300,70 330,82 360,94 390,104 390,78 420,87 420,81 450,90 450,84 490,96 490,40 520,49 520,43 550,52 550,46 590,58 590,210"/>
  <path class="d-line-hot" d="M584 204L596 216M596 204L584 216"/>
  <text class="d-edge" x="60" y="232" text-anchor="start">anchor</text>
  <text class="d-sub" x="60" y="247" text-anchor="start">T = 1</text>
  <text class="d-edge" x="300" y="232" text-anchor="middle">leaves desk</text>
  <text class="d-sub" x="300" y="247" text-anchor="middle">evidence missing</text>

</svg>

<figcaption><strong>Missing evidence decays; contradiction ends it</strong> (proposal, not a benchmark). An anchor (a hard biometric on an attested sensor) sets trust to 1. Passive refreshes, such as an attested face match, nudge it back up as it decays. Missing evidence, like an owner stepping away, only lets trust fall slowly. Contradictory evidence, like a different face, cuts it to zero at once. A vault action below the threshold makes the loop schedule a re-anchor<sup class="cite">[<a href="#ref-124">124</a>, <a href="#ref-181">181</a>]</sup>.</figcaption>
</figure>
