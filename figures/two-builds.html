<svg viewBox="0 0 760 300" role="img" aria-label="One loop feeds two enforcement points. On a consumer laptop or desktop, a Vault hub with a secure element sits inline on the input devices, routes input, and releases keys to the vaulted zone per action, while the ordinary desktop is best effort and agents work in their own workspace. At an AI lab, a secretless terminal signs loop state every one to two seconds to a lab verifier, which renews a seconds-scale key inside the confidential VM holding the weights; export and egress also need a quorum and a delay.">

    <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0 0L10 5L0 10z"/></marker>
    <marker id="tb-arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="d-arrow-hot" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="d-box" x="230" y="14" width="300" height="46" rx="5"/>
  <text class="d-label" x="380" y="34" text-anchor="middle">One loop</text>
  <text class="d-sub" x="380" y="50" text-anchor="middle">channels · cross-checks · trust engine</text>

  <path class="d-line" d="M330 60V78H195V96" marker-end="url(#tb-arrow)"/>

<figcaption><strong>Same loop, two enforcement points</strong> (proposal). On a consumer machine, the proposed Vault hub holds the keys to the vaulted zone. It sits inline on the external keyboard, mouse and display and releases keys one action at a time. The rest of the desktop is protected only on a best-effort basis, and a laptop's built-in keyboard can't be put inline. At a lab, the terminal holds no secrets: it streams signed loop state to a verifier, and the confidential VM drops its session key the moment that stream lapses or shows a contradiction<sup class="cite">[<a href="#ref-33">33</a>, <a href="#ref-34">34</a>, <a href="#ref-76">76</a>]</sup>.</figcaption>
