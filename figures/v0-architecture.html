<figcaption><strong>Proposed v0 reference architecture.</strong> The terminal holds no weights and no long-lived keys. Its secure element matches the operator on-device and signs a presence attestation every few seconds. A lab-controlled verifier renews a seconds-scale session key inside the confidential VM only while those attestations stay fresh; when they lapse, the key is dropped. Irreversible actions also need a biometric-bound quorum and a delay. Duress flags go silently to security operations, and only rendered output returns to the terminal<sup class="cite">[<a href="#ref-13">13</a>, <a href="#ref-6">6</a>, <a href="#ref-23">23</a>]</sup>.</figcaption>
</figure>
